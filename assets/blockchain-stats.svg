<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="60%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#03060f" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="cyanAmbient" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleAmbient" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Progress Bar Gradients -->
    <linearGradient id="progJS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="progMove" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="progHTML" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="progJava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>

    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.95; }
      }
      @keyframes barAnimate {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatSubtle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .pulse-dot { animation: pulseSlow 2s ease-in-out infinite; }
      .float-box { animation: floatSubtle 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Base -->
  <rect width="1000" height="360" rx="14" fill="url(#bgCard)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1000" height="360" fill="url(#cyanAmbient)" />
  <rect width="1000" height="360" fill="url(#purpleAmbient)" />
  <rect width="1000" height="360" fill="url(#cardGrid)" />

  <!-- Cyber Corners -->
  <path d="M 20 35 L 20 20 L 35 20" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 980 35 L 980 20 L 965 20" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 20 325 L 20 340 L 35 340" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 980 325 L 980 340 L 965 340" stroke="#00f2fe" stroke-width="2" fill="none" />

  <!-- Header Section -->
  <g transform="translate(35, 38)">
    <circle cx="6" cy="6" r="4.5" fill="#10b981" class="pulse-dot" />
    <text x="20" y="10" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">ON-CHAIN &amp; GITHUB TELEMETRY</text>
    <text x="350" y="10" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">│</text>
    <text x="370" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">USER: <tspan fill="#38bdf8" font-weight="bold">DevLabsss</tspan></text>
    <text x="560" y="10" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">│</text>
    <text x="580" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">PROTOCOL: <tspan fill="#a855f7" font-weight="bold">SUI NETWORK</tspan></text>
    <text x="820" y="10" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">STATUS: VERIFIED ✓</text>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="62" x2="965" y2="62" stroke="#1e293b" stroke-width="1.2" />

  <!-- ==================== LEFT COLUMN: METRICS & CONTRIBUTIONS ==================== -->
  <g transform="translate(35, 80)">
    
    <!-- Stat Box 1: Total Contributions -->
    <g transform="translate(0, 0)">
      <rect width="215" height="110" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <rect width="215" height="110" rx="10" fill="#00f2fe" fill-opacity="0.03" />
      <text x="18" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">CONTRIBUTIONS</text>
      <text x="18" y="74" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="34" font-weight="900" filter="url(#glow)">130+</text>
      <text x="18" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">All-time Commits &amp; PRs</text>
      <circle cx="185" cy="30" r="14" fill="#072033" stroke="#00f2fe" stroke-width="1" />
      <text x="185" y="34" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">⚡</text>
    </g>

    <!-- Stat Box 2: Current Streak -->
    <g transform="translate(230, 0)">
      <rect width="215" height="110" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <rect width="215" height="110" rx="10" fill="#a855f7" fill-opacity="0.03" />
      <text x="18" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">CURRENT STREAK</text>
      <text x="18" y="74" fill="#c084fc" font-family="'Inter', sans-serif" font-size="34" font-weight="900" filter="url(#glow)">2 DAYS</text>
      <text x="18" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Max Streak: 4 Days</text>
      <circle cx="185" cy="30" r="14" fill="#1e1035" stroke="#a855f7" stroke-width="1" />
      <text x="185" y="35" fill="#a855f7" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">🔥</text>
    </g>

    <!-- Stat Box 3: Repositories -->
    <g transform="translate(0, 125)">
      <rect width="215" height="110" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <rect width="215" height="110" rx="10" fill="#fbbf24" fill-opacity="0.03" />
      <text x="18" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">REPOSITORIES</text>
      <text x="18" y="74" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="34" font-weight="900" filter="url(#glow)">10+</text>
      <text x="18" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Web &amp; Smart Contract</text>
      <circle cx="185" cy="30" r="14" fill="#241a05" stroke="#fbbf24" stroke-width="1" />
      <text x="185" y="34" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">📦</text>
    </g>

    <!-- Stat Box 4: Web3 Ecosystem -->
    <g transform="translate(230, 125)">
      <rect width="215" height="110" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <rect width="215" height="110" rx="10" fill="#38bdf8" fill-opacity="0.03" />
      <text x="18" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">ECOSYSTEM</text>
      <text x="18" y="74" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="28" font-weight="900" filter="url(#glow)">SUI MOVE</text>
      <text x="18" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Testnet Coordinator</text>
      <circle cx="185" cy="30" r="14" fill="#072033" stroke="#38bdf8" stroke-width="1" />
      <text x="185" y="35" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">💧</text>
    </g>

  </g>

  <!-- Vertical Divider -->
  <line x1="505" y1="80" x2="505" y2="315" stroke="#1e293b" stroke-width="1.2" />

  <!-- ==================== RIGHT COLUMN: TOP LANGUAGES & TECH ==================== -->
  <g transform="translate(535, 80)">
    
    <text x="0" y="20" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="2">
      // TOP ARCHITECTURE &amp; LANGUAGES
    </text>

    <!-- Language 1: TypeScript / JavaScript -->
    <g transform="translate(0, 40)">
      <text x="0" y="14" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">TypeScript / Next.js</text>
      <text x="430" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="end">45%</text>
      <!-- Track -->
      <rect x="0" y="24" width="430" height="10" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <!-- Fill -->
      <rect x="0" y="24" width="195" height="10" rx="5" fill="url(#progJS)" filter="url(#glow)" />
    </g>

    <!-- Language 2: Sui Move / Web3 -->
    <g transform="translate(0, 95)">
      <text x="0" y="14" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Sui Move / Blockchain</text>
      <text x="430" y="14" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="end">30%</text>
      <!-- Track -->
      <rect x="0" y="24" width="430" height="10" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <!-- Fill -->
      <rect x="0" y="24" width="130" height="10" rx="5" fill="url(#progMove)" filter="url(#glow)" />
    </g>

    <!-- Language 3: HTML / CSS / Tailwind -->
    <g transform="translate(0, 150)">
      <text x="0" y="14" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">HTML5 · CSS3 · Tailwind</text>
      <text x="430" y="14" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="end">15%</text>
      <!-- Track -->
      <rect x="0" y="24" width="430" height="10" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <!-- Fill -->
      <rect x="0" y="24" width="65" height="10" rx="5" fill="url(#progHTML)" filter="url(#glow)" />
    </g>

    <!-- Language 4: Java & Backend / MySQL -->
    <g transform="translate(0, 205)">
      <text x="0" y="14" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Java · Node.js · MySQL</text>
      <text x="430" y="14" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="end">10%</text>
      <!-- Track -->
      <rect x="0" y="24" width="430" height="10" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <!-- Fill -->
      <rect x="0" y="24" width="45" height="10" rx="5" fill="url(#progJava)" filter="url(#glow)" />
    </g>

  </g>

  <!-- Bottom Mini Footer -->
  <g transform="translate(35, 335)">
    <text fill="#475569" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">
      HASH: <tspan fill="#64748b">0x3f7a...9c1b</tspan> │ MYSTICETI ENGINE │ DECENTRALIZED DATA COMMITTED
    </text>
  </g>

</svg>
