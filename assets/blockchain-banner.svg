<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4da2ff" />
      <stop offset="100%" stop-color="#b794f6" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Eth / Purple Gradient -->
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Sui Water Drop Gradient -->
    <linearGradient id="suiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Isometric Cube Pattern Components -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cubeGoldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cubePurpleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.95; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes packetPulse {
        0% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.4); opacity: 1; }
        100% { transform: scale(1); opacity: 0.6; }
      }
      @keyframes tickerSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      @keyframes radarWave {
        0% { r: 10px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 55px; opacity: 0; stroke-width: 0.5px; }
      }

      .floating-block-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-block-2 { animation: floatFast 6s ease-in-out infinite; animation-delay: -2s; }
      .floating-block-3 { animation: floatSlow 7s ease-in-out infinite; animation-delay: -3.5s; }
      .spin-clockwise { transform-origin: 1020px 170px; animation: spinSlow 20s linear infinite; }
      .spin-counter { transform-origin: 1020px 170px; animation: spinReverse 15s linear infinite; }
      .pulsing-node { animation: pulseGlow 2.5s ease-in-out infinite; }
      .pulsing-node-fast { animation: pulseGlow 1.4s ease-in-out infinite; }
      .moving-line { stroke-dasharray: 8 6; animation: dashFlow 4s linear infinite; }
      .moving-line-fast { stroke-dasharray: 6 4; animation: dashFlow 2s linear infinite; }
      .crypto-radar { animation: radarWave 3s cubic-bezier(0.1, 0.5, 0.8, 1) infinite; }
      .ticker-text { animation: tickerSlide 25s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="14" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Cyber Radial Glows -->
  <rect width="1200" height="380" fill="url(#cyanGlow)" />
  <rect width="1200" height="380" fill="url(#purpleGlow)" />
  <rect width="1200" height="380" fill="url(#blueGlow)" />

  <!-- Matrix Grid -->
  <rect width="1200" height="340" fill="url(#grid)" />

  <!-- Top / Corner Cyber HUD Brackets -->
  <path d="M 25 45 L 25 25 L 45 25" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 1175 45 L 1175 25 L 1155 25" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 25 315 L 25 335 L 45 335" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 1175 315 L 1175 335 L 1155 335" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Top HUD Status Bar -->
  <g transform="translate(45, 38)">
    <circle cx="6" cy="6" r="4" fill="#10b981" class="pulsing-node-fast" />
    <text x="18" y="10" fill="#10b981" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1.5">NETWORK ONLINE // SUI TESTNET</text>
    
    <text x="320" y="10" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">|</text>
    <text x="338" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">CONSENSUS: <tspan fill="#38bdf8">MYSTICETI</tspan></text>
    
    <text x="560" y="10" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">|</text>
    <text x="578" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">BLOCK_HASH: <tspan fill="#a855f7">0x7A9F...88DE</tspan></text>

    <text x="820" y="10" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">|</text>
    <text x="838" y="10" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">TPS: 297,420</text>
  </g>

  <!-- ==================== LEFT SIDE: BLOCKCHAIN BLOCKS & NODES ==================== -->
  
  <!-- Blockchain Network Connection Vectors -->
  <g opacity="0.85">
    <!-- Main Chain Line -->
    <path d="M 80 190 L 160 140 L 250 200 L 170 270 Z" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.3" />
    <path d="M 160 140 L 250 200" stroke="#00f2fe" stroke-width="2" class="moving-line" filter="url(#glowCyan)" />
    <path d="M 250 200 L 330 150" stroke="#818cf8" stroke-width="2" class="moving-line-fast" />
    <path d="M 80 190 L 170 270" stroke="#38bdf8" stroke-width="1.5" class="moving-line" />
    <path d="M 170 270 L 250 200" stroke="#c084fc" stroke-width="1.8" class="moving-line" />

    <!-- Chain links to center -->
    <path d="M 250 200 L 390 190" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1" opacity="0.5" />
    <path d="M 160 140 L 390 100" stroke="#00f2fe" stroke-dasharray="2 6" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Block 1: Isometric Cube (Left, Floating) -->
  <g class="floating-block-1" transform="translate(60, 160)">
    <!-- Top Face -->
    <polygon points="40,0 80,18 40,36 0,18" fill="url(#cubeTop)" stroke="#00f2fe" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="0,18 40,36 40,82 0,64" fill="url(#cubeLeft)" stroke="#00f2fe" stroke-width="1" />
    <!-- Right Face -->
    <polygon points="40,36 80,18 80,64 40,82" fill="url(#cubeRight)" stroke="#38bdf8" stroke-width="1" />
    <!-- Block Hash Text -->
    <text x="8" y="52" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">#GENESIS</text>
    <text x="8" y="63" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7">0x0001</text>
    <circle cx="40" cy="18" r="3" fill="#00f2fe" filter="url(#glowCyan)" />
  </g>

  <!-- Block 2: Isometric Cube Center-Left (Elevated, Cyan/Purple) -->
  <g class="floating-block-2" transform="translate(180, 95)">
    <!-- Top Face -->
    <polygon points="50,0 100,22 50,44 0,22" fill="url(#cubeTop)" stroke="#a855f7" stroke-width="1.2" />
    <!-- Left Face -->
    <polygon points="0,22 50,44 50,100 0,78" fill="url(#cubePurpleLeft)" stroke="#a855f7" stroke-width="1.2" />
    <!-- Right Face -->
    <polygon points="50,44 100,22 100,78 50,100" fill="url(#cubeRight)" stroke="#818cf8" stroke-width="1.2" />
    <!-- Data inside Block -->
    <text x="12" y="60" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">BLOCK #1337</text>
    <text x="12" y="73" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="7.5">TXs: 3,412</text>
    <text x="12" y="85" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="7">SUI-MOVE</text>
    <circle cx="50" cy="22" r="4" fill="#a855f7" filter="url(#glowCyan)" />
  </g>

  <!-- Block 3: Gold / Crypto Cube Lower Left -->
  <g class="floating-block-3" transform="translate(130, 230)">
    <!-- Top Face -->
    <polygon points="35,0 70,16 35,32 0,16" fill="url(#cubeTop)" stroke="#f59e0b" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="0,16 35,32 35,72 0,56" fill="url(#cubeGoldLeft)" stroke="#fbbf24" stroke-width="1" />
    <!-- Right Face -->
    <polygon points="35,32 70,16 70,56 35,72" fill="url(#cubeRight)" stroke="#f59e0b" stroke-width="1" />
    <!-- Data -->
    <text x="6" y="48" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold">VALIDATED</text>
    <text x="6" y="59" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="7">PROOF_STAKE</text>
    <circle cx="35" cy="16" r="3" fill="#fbbf24" filter="url(#glowCyan)" />
  </g>

  <!-- Glowing Blockchain Nodes on Left -->
  <g>
    <circle cx="80" cy="190" r="5" fill="#00f2fe" class="pulsing-node" filter="url(#glowCyan)" />
    <circle cx="160" cy="140" r="6" fill="#a855f7" class="pulsing-node-fast" filter="url(#glowCyan)" />
    <circle cx="250" cy="200" r="7" fill="#38bdf8" class="pulsing-node" filter="url(#glowCyan)" />
    <circle cx="170" cy="270" r="5" fill="#fbbf24" class="pulsing-node" filter="url(#glowCyan)" />
    
    <!-- Packet traveling animation along the nodes -->
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#glowCyan)">
      <animateMotion path="M 80 190 L 160 140 L 250 200 L 170 270 Z" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== CENTER: HERO TYPOGRAPHY & IDENTITY ==================== -->
  
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Web3 Ecosystem Pill Badge -->
    <rect x="-140" y="-76" width="280" height="28" rx="14" fill="#0f172a" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="-118" cy="-62" r="4" fill="#00f2fe" class="pulsing-node" />
    <text x="8" y="-57" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="3">WEB3 &amp; SUI DEVELOPER</text>

    <!-- Main Name Title -->
    <text x="0" y="-10" fill="url(#textGrad)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5" filter="url(#glowCyan)">
      ACHMAD SYAHRIL FAUZI
    </text>

    <!-- Subtitle / Architecture Role -->
    <text x="0" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" letter-spacing="3.5">
      &lt; DECENTRALIZED SYSTEMS · ON-CHAIN DEV &gt;
    </text>

    <!-- Crypto Badges Line (Sui, Smart Contracts, Testnet) -->
    <g transform="translate(0, 52)">
      <!-- Badge 1: SUI -->
      <rect x="-175" y="0" width="105" height="26" rx="6" fill="#0a192f" stroke="#38bdf8" stroke-width="1" />
      <text x="-122" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">💧 SUI MOVE</text>

      <!-- Badge 2: TESTNET COORDINATOR -->
      <rect x="-60" y="0" width="120" height="26" rx="6" fill="#1e1035" stroke="#a855f7" stroke-width="1" />
      <text x="0" y="17" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">⚡ WEB3 INFRA</text>

      <!-- Badge 3: FULL STACK -->
      <rect x="70" y="0" width="105" height="26" rx="6" fill="#062520" stroke="#10b981" stroke-width="1" />
      <text x="122" y="17" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">✦ FULL-STACK</text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: CRYPTOCURRENCY GYROSCOPE & TOKENS ==================== -->
  
  <!-- Orbital Rings / Gyroscope (Animated rotation) -->
  <g>
    <!-- Outer Gyro Ring (Cyan) -->
    <circle cx="1020" cy="170" r="95" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="14 10" opacity="0.5" class="spin-clockwise" />
    
    <!-- Middle Gyro Ring (Purple/Indigo) -->
    <ellipse cx="1020" cy="170" rx="80" ry="45" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.7" transform="rotate(-30 1020 170)" class="spin-counter" />
    
    <!-- Inner Gyro Ring (Gold/Amber) -->
    <ellipse cx="1020" cy="170" rx="65" ry="30" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.6" transform="rotate(45 1020 170)" class="spin-clockwise" />

    <!-- Radar Pulse Waves expanding from center -->
    <circle cx="1020" cy="170" r="15" fill="none" stroke="#00f2fe" class="crypto-radar" />
    <circle cx="1020" cy="170" r="15" fill="none" stroke="#38bdf8" class="crypto-radar" style="animation-delay: -1.5s;" />

    <!-- Core Central Node -->
    <circle cx="1020" cy="170" r="26" fill="#091428" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)" />
    
    <!-- SUI Water Drop in Core -->
    <path d="M 1020 153 C 1020 153 1008 168 1008 175 C 1008 181.6 1013.4 187 1020 187 C 1026.6 187 1032 181.6 1032 175 C 1032 168 1020 153 1020 153 Z" fill="url(#suiGrad)" />
    <circle cx="1017" cy="172" r="2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Orbiting Crypto Tokens -->
  
  <!-- Token 1: Ethereum Diamond (Top Right, Floating) -->
  <g class="floating-block-1" transform="translate(950, 75)">
    <circle cx="20" cy="20" r="20" fill="#130e26" stroke="#a855f7" stroke-width="1.5" filter="url(#glowCyan)" />
    <!-- Ethereum Prism Shape -->
    <polygon points="20,8 29,21 20,17 11,21" fill="#c084fc" opacity="0.9" />
    <polygon points="20,8 11,21 20,17" fill="#a855f7" />
    <polygon points="20,19 29,23 20,32 11,23" fill="#e9d5ff" opacity="0.9" />
    <polygon points="20,19 11,23 20,32" fill="#9333ea" />
  </g>

  <!-- Token 2: Bitcoin Hexagon (Bottom Right, Floating) -->
  <g class="floating-block-2" transform="translate(1085, 230)">
    <circle cx="20" cy="20" r="20" fill="#241400" stroke="#f59e0b" stroke-width="1.5" filter="url(#glowCyan)" />
    <!-- Bitcoin ₿ Glyph -->
    <text x="20" y="27" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="19" font-weight="900" text-anchor="middle">₿</text>
  </g>

  <!-- Token 3: Smart Contract / Code Block (Top Far Right) -->
  <g class="floating-block-3" transform="translate(1090, 85)">
    <rect x="0" y="0" width="36" height="32" rx="6" fill="#061c24" stroke="#00f2fe" stroke-width="1.2" />
    <text x="18" y="14" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    <text x="18" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="bold" text-anchor="middle">MOVE</text>
  </g>

  <!-- Right Side Constellation Data Packet -->
  <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#glowCyan)">
    <animateMotion path="M 1020 170 L 970 95 L 1105 250 L 1020 170" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== BOTTOM HUD: ANIMATED CRYPTO TICKER ==================== -->
  
  <g transform="translate(0, 345)">
    <!-- Ticker Background Bar -->
    <rect x="0" y="0" width="1200" height="35" rx="0 0 14 14" fill="#060914" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="120" height="35" fill="#0a1024" stroke="#00f2fe" stroke-width="0.8" />
    
    <text x="60" y="21" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" letter-spacing="1.5" text-anchor="middle">
      LEDGER LIVE
    </text>

    <!-- Infinite Scrolling Hash Ticker -->
    <g transform="translate(130, 21)">
      <g class="ticker-text">
        <text fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.5">
          <tspan fill="#38bdf8">INITIA LABS</tspan> [Testnet Coord] ── 
          <tspan fill="#a855f7">ELYS NETWORK</tspan> [Community &amp; Testnet] ── 
          <tspan fill="#f59e0b">UNION LABS</tspan> [Node Runner] ── 
          <tspan fill="#38bdf8">BUILD ON SUI</tspan> [BlockDevId] ── 
          <tspan fill="#10b981">GAS: 15 MIST</tspan> ── 
          <tspan fill="#cbd5e1">HASH: 0x9f8c47b12e6d5a80</tspan> ── 
          <tspan fill="#38bdf8">INITIA LABS</tspan> [Testnet Coord] ── 
          <tspan fill="#a855f7">ELYS NETWORK</tspan> [Community &amp; Testnet] ── 
          <tspan fill="#f59e0b">UNION LABS</tspan> [Node Runner] ── 
          <tspan fill="#38bdf8">BUILD ON SUI</tspan> [BlockDevId] ── 
          <tspan fill="#10b981">GAS: 15 MIST</tspan> ── 
          <tspan fill="#cbd5e1">HASH: 0x9f8c47b12e6d5a80</tspan>
        </text>
      </g>
    </g>
  </g>

</svg>
