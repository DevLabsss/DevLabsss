<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="420" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1833" />
      <stop offset="100%" stop-color="#060c1d" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="cyanSpread" cx="10%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleSpread" cx="90%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>

    <style>
      @keyframes pulseLive {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      @keyframes floatMini {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .live-dot { transform-origin: center; animation: pulseLive 1.8s ease-in-out infinite; }
      .border-pulse { animation: borderGlow 3s ease-in-out infinite; }
      .float-card-1 { animation: floatMini 5s ease-in-out infinite; }
      .float-card-2 { animation: floatMini 5.5s ease-in-out infinite; animation-delay: -2s; }
      .float-card-3 { animation: floatMini 6s ease-in-out infinite; animation-delay: -3.5s; }
      .float-card-4 { animation: floatMini 5.2s ease-in-out infinite; animation-delay: -1.2s; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="420" rx="14" fill="url(#projBg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1000" height="420" fill="url(#cyanSpread)" />
  <rect width="1000" height="420" fill="url(#purpleSpread)" />
  <rect width="1000" height="420" fill="url(#dotPattern)" />

  <!-- Top HUD Header -->
  <g transform="translate(35, 36)">
    <circle cx="6" cy="6" r="4.5" fill="#00f2fe" class="live-dot" />
    <text x="22" y="10" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">FEATURED ON-CHAIN &amp; WEB APPLICATIONS</text>
    <text x="520" y="10" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">│</text>
    <text x="540" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">SMART CONTRACTS · CLIENTS · DAPPS</text>
    <text x="840" y="10" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">DEPLOYED: ACTIVE ✓</text>
  </g>
  <line x1="35" y1="56" x2="965" y2="56" stroke="#1e293b" stroke-width="1.2" />

  <!-- ==================== 2x2 PROJECT GRID ==================== -->

  <!-- CARD 1: personal-portfolio (Top Left) -->
  <g class="float-card-1" transform="translate(35, 75)">
    <rect width="450" height="150" rx="10" fill="url(#cardBg)" stroke="#00f2fe" stroke-width="1.2" class="border-pulse" />
    <!-- Corner Decor -->
    <path d="M 10 20 L 10 10 L 20 10" stroke="#00f2fe" stroke-width="1.5" fill="none" />
    <!-- Header -->
    <text x="30" y="34" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">personal-portfolio</text>
    <!-- Live Badge -->
    <rect x="330" y="18" width="100" height="22" rx="11" fill="#06222b" stroke="#00f2fe" stroke-width="0.8" />
    <circle cx="344" cy="29" r="3.5" fill="#00f2fe" class="live-dot" />
    <text x="354" y="33" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">PRODUCTION</text>
    <!-- Description -->
    <text x="30" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Modern interactive portfolio showcasing Web3 builds,</text>
    <text x="30" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">blockchain integrations, and full-stack projects.</text>
    <!-- Stack Badges -->
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="70" height="22" rx="4" fill="#0e2340" stroke="#38bdf8" stroke-width="0.8" />
      <text x="35" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">Next.js</text>
      
      <rect x="78" y="0" width="90" height="22" rx="4" fill="#0f1f38" stroke="#3178c6" stroke-width="0.8" />
      <text x="123" y="15" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">TypeScript</text>

      <rect x="176" y="0" width="75" height="22" rx="4" fill="#072227" stroke="#06b6d4" stroke-width="0.8" />
      <text x="213" y="15" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">Tailwind</text>

      <text x="390" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">0xPORTFOLIO</text>
    </g>
  </g>

  <!-- CARD 2: Arweave-Academy / Web3 AO (Top Right) -->
  <g class="float-card-2" transform="translate(515, 75)">
    <rect width="450" height="150" rx="10" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.2" class="border-pulse" />
    <!-- Corner Decor -->
    <path d="M 440 20 L 440 10 L 430 10" stroke="#a855f7" stroke-width="1.5" fill="none" />
    <!-- Header -->
    <text x="30" y="34" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">Arweave-Academy</text>
    <!-- Web3 Badge -->
    <rect x="330" y="18" width="100" height="22" rx="11" fill="#1e1035" stroke="#a855f7" stroke-width="0.8" />
    <circle cx="344" cy="29" r="3.5" fill="#a855f7" class="live-dot" />
    <text x="354" y="33" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">WEB3 · AO</text>
    <!-- Description -->
    <text x="30" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Mastering Arweave AO development and decentralized</text>
    <text x="30" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">hyper-parallel compute architecture for on-chain apps.</text>
    <!-- Stack Badges -->
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="75" height="22" rx="4" fill="#1e1035" stroke="#a855f7" stroke-width="0.8" />
      <text x="37" y="15" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">Arweave</text>
      
      <rect x="83" y="0" width="65" height="22" rx="4" fill="#131e3a" stroke="#818cf8" stroke-width="0.8" />
      <text x="115" y="15" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">AO Dev</text>

      <rect x="156" y="0" width="95" height="22" rx="4" fill="#0d2427" stroke="#2dd4bf" stroke-width="0.8" />
      <text x="203" y="15" fill="#5eead4" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">Smart Contract</text>

      <text x="390" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">0xARWEAVE</text>
    </g>
  </g>

  <!-- CARD 3: CV. Laras Gemilang Teknika (Bottom Left) -->
  <g class="float-card-3" transform="translate(35, 245)">
    <rect width="450" height="150" rx="10" fill="url(#cardBg)" stroke="#fbbf24" stroke-width="1.2" class="border-pulse" />
    <!-- Corner Decor -->
    <path d="M 10 130 L 10 140 L 20 140" stroke="#fbbf24" stroke-width="1.5" fill="none" />
    <!-- Header -->
    <text x="30" y="34" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">CV. Laras Gemilang</text>
    <!-- Status Badge -->
    <rect x="330" y="18" width="100" height="22" rx="11" fill="#241a05" stroke="#fbbf24" stroke-width="0.8" />
    <circle cx="344" cy="29" r="3.5" fill="#fbbf24" class="live-dot" />
    <text x="354" y="33" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">PKM PORTAL</text>
    <!-- Description -->
    <text x="30" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Company profile and industrial service portal developed</text>
    <text x="30" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">for Community Service Program (PKM) with responsive UI.</text>
    <!-- Stack Badges -->
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="65" height="22" rx="4" fill="#291807" stroke="#f97316" stroke-width="0.8" />
      <text x="32" y="15" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">HTML5</text>
      
      <rect x="73" y="0" width="65" height="22" rx="4" fill="#081e36" stroke="#38bdf8" stroke-width="0.8" />
      <text x="105" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">CSS3</text>

      <rect x="146" y="0" width="75" height="22" rx="4" fill="#1b1c2e" stroke="#818cf8" stroke-width="0.8" />
      <text x="183" y="15" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">JavaScript</text>

      <text x="390" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">0xENTERPRISE</text>
    </g>
  </g>

  <!-- CARD 4: POS McDonald's (Bottom Right) -->
  <g class="float-card-4" transform="translate(515, 245)">
    <rect width="450" height="150" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.2" class="border-pulse" />
    <!-- Corner Decor -->
    <path d="M 440 130 L 440 140 L 430 140" stroke="#10b981" stroke-width="1.5" fill="none" />
    <!-- Header -->
    <text x="30" y="34" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">POS McDonald's</text>
    <!-- Status Badge -->
    <rect x="330" y="18" width="100" height="22" rx="11" fill="#04231b" stroke="#10b981" stroke-width="0.8" />
    <circle cx="344" cy="29" r="3.5" fill="#10b981" class="live-dot" />
    <text x="354" y="33" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">ENTERPRISE</text>
    <!-- Description -->
    <text x="30" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Desktop Point of Sale (POS) cashier application</text>
    <text x="30" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">with relational database transaction and sales reporting.</text>
    <!-- Stack Badges -->
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#291206" stroke="#ea580c" stroke-width="0.8" />
      <text x="30" y="15" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">Java</text>
      
      <rect x="68" y="0" width="65" height="22" rx="4" fill="#092036" stroke="#0284c7" stroke-width="0.8" />
      <text x="100" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">MySQL</text>

      <rect x="141" y="0" width="80" height="22" rx="4" fill="#152119" stroke="#10b981" stroke-width="0.8" />
      <text x="181" y="15" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="bold">Swing GUI</text>

      <text x="390" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">0xPOS_APP</text>
    </g>
  </g>

</svg>
