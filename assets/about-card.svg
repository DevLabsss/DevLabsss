<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#03060f" />
    </linearGradient>

    <!-- Radial Accents -->
    <radialGradient id="cyanSpread" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleSpread" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Sui Water Drop Gradient -->
    <linearGradient id="suiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="headingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="aboutGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.2" />
    </pattern>

    <style>
      @keyframes pulseLive {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes borderBreathe {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      .live-dot { transform-origin: center; animation: pulseLive 1.8s ease-in-out infinite; }
      .float-avatar { animation: floatSoft 4.5s ease-in-out infinite; }
      .spin-ring { transform-origin: 90px 105px; animation: spinSlow 15s linear infinite; }
      .border-glow { animation: borderBreathe 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Base -->
  <rect width="1000" height="220" rx="14" fill="url(#aboutBg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1000" height="220" fill="url(#cyanSpread)" />
  <rect width="1000" height="220" fill="url(#purpleSpread)" />
  <rect width="1000" height="220" fill="url(#aboutGrid)" />

  <!-- Cyber Edge Corners -->
  <path d="M 15 30 L 15 15 L 30 15" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 985 30 L 985 15 L 970 15" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 15 190 L 15 205 L 30 205" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 985 190 L 985 205 L 970 205" stroke="#00f2fe" stroke-width="2" fill="none" />

  <!-- ==================== LEFT: ANIMATED HOLO-NODE AVATAR ==================== -->
  <g class="float-avatar">
    <!-- Rotating Cyber Ring -->
    <circle cx="90" cy="105" r="55" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="10 8" opacity="0.6" class="spin-ring" />
    <circle cx="90" cy="105" r="46" fill="#091428" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowCyan)" />
    
    <!-- Central Sui Drop Hologram -->
    <path d="M 90 85 C 90 85 76 104 76 112 C 76 120 82.2 126 90 126 C 97.8 126 104 120 104 112 C 104 104 90 85 90 85 Z" fill="url(#suiGrad)" />
    <circle cx="86" cy="108" r="2.5" fill="#ffffff" opacity="0.8" />

    <!-- Mini Status Pill under Node -->
    <rect x="45" y="168" width="90" height="20" rx="10" fill="#061c24" stroke="#10b981" stroke-width="0.8" />
    <circle cx="58" cy="178" r="3.5" fill="#10b981" class="live-dot" />
    <text x="68" y="181.5" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">ACTIVE NODE</text>
  </g>

  <!-- ==================== RIGHT: ABOUT BIO CONTENT ==================== -->
  <g transform="translate(180, 42)">
    
    <!-- Header Title (NO '//') -->
    <text x="0" y="8" fill="url(#headingGrad)" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" filter="url(#glowCyan)">
      ABOUT ME
    </text>
    <text x="145" y="6" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12">│</text>
    <text x="160" y="6" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">DECENTRALIZED ARCHITECT &amp; WEB BUILDER</text>

    <!-- Bio Description Lines -->
    <text x="0" y="44" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13.5" font-weight="500">
      🎓 Mahasiswa <tspan fill="#38bdf8" font-weight="bold">Teknik Informatika</tspan> di Universitas Pamulang yang berfokus membangun aplikasi web modern.
    </text>
    
    <text x="0" y="70" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400">
      ⚡ Aktif mengeksplorasi ekosistem <tspan fill="#c084fc" font-weight="bold">Blockchain &amp; Web3</tspan>, smart contract Move, dan infrastruktur testnet terdesentralisasi.
    </text>

    <text x="0" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400">
      💡 Berprinsip pada <tspan fill="#00f2fe">kode yang bersih</tspan>, arsitektur modular yang kokoh, dan eksperimen berkelanjutan on-chain.
    </text>

    <!-- Animated Tech Focus Badges -->
    <g transform="translate(0, 122)">
      <!-- Badge 1: SUI -->
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#071d2b" stroke="#38bdf8" stroke-width="0.8" />
      <text x="65" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">💧 Sui Ecosystem</text>

      <!-- Badge 2: MOVE -->
      <rect x="142" y="0" width="165" height="24" rx="6" fill="#1b0e2b" stroke="#c084fc" stroke-width="0.8" />
      <text x="224" y="16" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">⚡ Move Smart Contracts</text>

      <!-- Badge 3: FULL STACK -->
      <rect x="319" y="0" width="160" height="24" rx="6" fill="#061c1a" stroke="#10b981" stroke-width="0.8" />
      <text x="399" y="16" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">🌐 Modern Web &amp; Next.js</text>

      <!-- Badge 4: TESTNET -->
      <rect x="491" y="0" width="160" height="24" rx="6" fill="#241a05" stroke="#fbbf24" stroke-width="0.8" />
      <text x="571" y="16" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">🔗 Testnet Coordinator</text>
    </g>

  </g>

</svg>
